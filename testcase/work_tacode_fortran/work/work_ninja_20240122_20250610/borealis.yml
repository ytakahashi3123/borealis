# Configuration file for Borealis code

adapter: 
  # tacode, simple_function, or example_externalcode
  kind_adapter: tacode
  

optimizer: 
  # Bayesian_optimization or PSO
  #kind_optimizer: Bayesian_optimization
  kind_optimizer: PSO


objectives:
   num_objectives: 1
   

parameter_optimized:
  # Parameter boundaries
  boundary:
#    - name: '# Initial coordinate' 
#      component:
#        - type: coord_longitude # Degree
#          bound_min: -145
#          bound_max: -145
#        - type: coord_latitude  # Degree
#          bound_min: 50
#          bound_max: 50
#        - type: coord_altitude # meter in Tacode-Fotran
#          bound_min: 210000
#          bound_max: 210000
    - name: '# Initial velocity' 
      component:
        - type: longitude
          bound_min: -1600 #1750 #1500
          bound_max: -1000 #1850 #2000
        - type: latitude
          bound_min: -7800 #7300 #7050
          bound_max: -7200 #7375 #7650
        - type: altitude
          bound_min: -20 #-20
          bound_max: 20 #20
#    - name: '# fa10.7'
#      component:
#        - type: lower_bound_0
#          bound_min: 100
#          bound_max: 250
  # Penalty
  flag_penalty: True
  penalty_value: 1000.0

  flag_with_timeerror: True
  set_altitude: 
   - 380 #km
  set_count_pass: 1 # 設定高度を何回通り過ぎた点同士で時間差計算を行うか
  weight_time:  0.001 # Added by Tomoki Sakai 2023/3/7 誤差計算の時間項にかける定数　dafault : 1
  

PSO: # Particle swarm optimization
  # Number of iterations
  num_optiter: 100 

  # Number of particles
  num_particle: 40 #test, 本番は20040 # 最適化パラメータを増やすのに伴い増やすと，効果がある．

  # Minimize or maximize the objective function
  maximize: False

  # Tolerance of effor of objective function
  tolerance: 1.e-12 #1.e-7

  # Particle parameter for PSO
  inertia: 0.5 # 0.5 大きくすると，探索のランダム性が強くなる
  cognitive_coef: 1.5 # 1.5 大きくすると，まとまろうとする
  social_coef: 1.5 # 1.5 大きくすると，まとまろうとする

  # Results data file (Tecplot data format)
  result_dir: result_PSO
  filename_output: output_PSO.dat
  filename_global: output_global.dat  


reference:

  directory_path_specify: manual # default or manual
  manual_path: ../../reference/ninja_20240122_20250610
  filename_input: trajectory.dat

  var_x: time_day
  var_y:
    - longitude
    - latitude
    - altitude

  timeunit: day # これがsecだと，referenceの時間はsec，tacodeの時間はdayで比較計算をすることになるので，うまくいかない．


tacode:

  # Code system: python3 (tacode ver2.0) or Fortran (tacoed ver1.0)
  code_system: fortran

  # tacode case directory
  work_dir: work_tacode
  case_dir: case
  step_digit: 4

  directory_path_specify: manual # default or manual
  manual_path: ../../template/ninja_20240122_20250610

  # Executing script
  cmd_code: ./run_tacode.sh
  
  # Control file
  filename_control: orbit.ctl
  
  # Result file name computed by Tacode
  filename_result: trajectory.dat
  
  # Tiem variables (Tacodeではsecondで出力されるのでその変換を行う)
  convert_timeunit_tapost: sec2day

  # 時刻にオフセットを与える（Tacodeでは0secondが計算開始時刻なので、サンプル・最適化結果と比較用するときはこれをつかう）
  # 時刻オフセット値はここで決定する
  time_start: 43506395
  time_end:   43516395
  target_time: 43506395


  # Result trajectory of Tacode 
  result_dir: result_tacode
  flag_output: False
  filename_output: output_result.dat
